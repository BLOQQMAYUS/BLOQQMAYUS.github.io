const STARS = 620, SD = 3600, STAR_PERSP = 900, NEARCAM = 40, KMAX = 6;

}
/* cometas: uno a la vez, cada uno con su propia profundidad (lejos = fino, lento,
   tenue; cerca = largo, rápido, brillante), dirección y recorrido al azar */
let comet = null, nextComet = performance.now() + 2500, cometLast = 0;
const crnd = (a, b) => a + Math.random() * (b - a);
function newComet() {
  const R = Math.hypot(SW, SH) / 2, d = Math.random();   // 0 lejos … 1 cerca
  const th = Math.random() * 6.2832, ph = crnd(-.9, .9);
  const sx = SW / 2 + Math.cos(th) * R * 1.05, sy = SH / 2 + Math.sin(th) * R * 1.05;
  const tx = SW / 2 + crnd(-.35, .35) * SW, ty = SH / 2 + crnd(-.35, .35) * SH;
  let dx = tx - sx, dy = ty - sy; const L = Math.hypot(dx, dy); dx /= L; dy /= L;
  const c = Math.cos(ph * .35), sn = Math.sin(ph * .35);
  const vx = dx * c - dy * sn, vy = dx * sn + dy * c;
  const travel = R * crnd(.9, 1.7), speed = Math.hypot(SW, SH) * (.07 + .5 * d * d) * crnd(.85, 1.2);
  return { sx, sy, vx, vy, travel, dur: travel / speed, life: 0,
    len: 40 + 230 * d, w: .7 + 1.5 * d, al: .3 + .6 * d, warm: Math.random() < .7 };
}
function paintComets(now) {
  const dt = Math.min((now - (cometLast || now)) / 1000, .06); cometLast = now;
  cg.clearRect(0, 0, SW, SH);
  if (!comet && now > nextComet) comet = newComet();
  if (!comet) return;
  comet.life += dt; const u = comet.life / comet.dur;
  if (u >= 1) { comet = null; nextComet = now + crnd(3500, 12000); return; }
  const hx = comet.sx + comet.vx * comet.travel * u, hy = comet.sy + comet.vy * comet.travel * u;
  const tx = hx - comet.vx * comet.len, ty = hy - comet.vy * comet.len;
  const f = Math.sin(Math.PI * Math.min(1, u * 1.0)) * comet.al;
  const gr = cg.createLinearGradient(hx, hy, tx, ty);
  gr.addColorStop(0, `rgba(244,238,227,${f.toFixed(3)})`);
  gr.addColorStop(.45, comet.warm ? `rgba(242,165,26,${(f * .5).toFixed(3)})` : `rgba(217,115,127,${(f * .45).toFixed(3)})`);
  gr.addColorStop(1, "rgba(242,165,26,0)");
  cg.strokeStyle = gr; cg.lineWidth = comet.w; cg.lineCap = "round";
  cg.beginPath(); cg.moveTo(hx, hy); cg.lineTo(tx, ty); cg.stroke();
}
function build() {
  pool = [];
  for (let i = 0; i < N; i++)
    pool.push({ ...UNIQUE[i % UNIQUE.length], copy: Math.floor(i / UNIQUE.length) });
  buildStars();
  world.insertAdjacentHTML("beforeend", pool.map(cardHTML).join(""));
  cards = [...world.querySelectorAll(".vcard")];
  world.querySelectorAll("img[data-yt]").forEach(armThumb);
  layout();
}
function setTF(c) {
  c.style.setProperty("--tf", `translate3d(${c._x}px,0,${c._z}px) rotateY(${c._ry}deg)`);
}
function layout() {
  cards.forEach((c, i) => {
    const left = i % 2 === 0;
    c._x = left ? -WALL : WALL;
    c._ry = left ? TILT : -TILT;
    c._z = -i * G;
    setTF(c);
  });
  computeRecycle();
}

/* ---------- umbral de reciclado por geometría ----------
   Antes era un z fijo (620): en monitores anchos las obras más anchas (las
   de YouTube, 340px) TODAVÍA estaban en cuadro a ese z, así que el reciclado
   las teletransportaba y desaparecían de golpe antes de salir de pantalla.
   Las verticales (216px) salían antes y no se notaba; en celu, con paredes
   más juntas y obras más chicas, tampoco pasaba.
   Ahora se calcula el z exacto en el que cada obra termina de salir del
   encuadre, según el ancho del viewport, la pared, su ancho y el giro:
     x_borde_interior · P / (P − z_borde) = ancho/2
   Se recicla recién ahí (+ margen), nunca antes. Sin lecturas de layout por
   frame: se calcula una vez y se recalcula al redimensionar. */
const PERSP = 900;                          // debe coincidir con #stage{perspective}
const recycleZ = new Map();
function computeRecycle() {
  const half = Math.max(1, innerWidth / 2);
  const rad = TILT * Math.PI / 180, cos = Math.cos(rad), sin = Math.sin(rad);
  for (const c of cards) {
    const w = c.offsetWidth || 340;
    const xIn = WALL - (w / 2) * cos;       // borde más cercano al pasillo
    const dz = (w / 2) * sin;               // ese borde queda más cerca de cámara
    const sale = xIn > 0 ? PERSP + dz - (xIn * PERSP) / half : 620;
    recycleZ.set(c, Math.min(870, Math.max(620, sale + 40)));
  }
}

/* ---------- botón "atrás" del celular ----------
   La mesa de luz empuja una entrada al historial: al volver atrás se cierra
   y la galería queda EXACTAMENTE donde estaba (camZ no se toca, no recarga).
   El iframe comparte el historial con el sitio, así que el atrás del teléfono
   cierra primero la mesa de luz y recién después la galería. */
const layers = [];
let layerSync = 0;
function layerPush(closeFn) { layers.push(closeFn); history.pushState({ bloqqGal: layers.length }, ""); }
function layerDrop() {
  if (!layers.length) return;
  layers.pop(); layerSync++; history.back();
}
addEventListener("popstate", () => {
  if (layerSync > 0) { layerSync--; return; }
  const fn = layers.pop();
  if (fn) fn(true);
});
/* el sitio consulta cuántas capas quedaron abiertas al cerrar la galería */
window.__bloqqLayers = () => layers.length;

/* ---------- loop ---------- */
function tick(t) {
  raf = requestAnimationFrame(tick);
  const dt = Math.min((t - lastT) / 1000, .05) || .016;
  lastT = t;
  if (cineOpen || document.hidden) return;
  if (targetZ !== null) {
    camZ += (targetZ - camZ) * Math.min(1, dt * 5);
    if (Math.abs(targetZ - camZ) < 1) { camZ = targetZ; targetZ = null; }
  } else if (!drag.down) {
    camZ += (AUTO + flyVel) * dt;
    flyVel *= Math.pow(.05, dt);
  }
  for (const c of cards) {
    const z = c._z + camZ;
    const T = recycleZ.get(c) || 620;
    if (z > T) { c._z -= D; setTF(c); }
    else if (z < T - D) { c._z += D; setTF(c); }
  }
  paintStars();
  paintComets(t);
  world.style.transform = `translateZ(${camZ}px)`;
}

/* ---------- avance: drag vertical / rueda / pellizco / botones ---------- */
const drag = { down: false };
const pts = new Map();
let sx = 0, sy = 0, lx = 0, ly = 0, lt = 0, moved = 0, pinchD = 0;
let downCard = null, downT = 0;
const seen = () => {};   /* el texto informativo se quitó por pedido */
stage.addEventListener("pointerdown", e => {
  pts.set(e.pointerId, e);
  if (pts.size === 1) {
    drag.down = true; moved = 0; sx = lx = e.clientX; sy = ly = e.clientY;
    lt = performance.now(); flyVel = 0; targetZ = null;
    downCard = cardAt(e.clientX, e.clientY); downT = performance.now();
    stage.classList.add("dragging");
  } else if (pts.size === 2) {
    const [a, b] = [...pts.values()];
    pinchD = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  }
  stage.setPointerCapture(e.pointerId);
  seen();
});
stage.addEventListener("pointermove", e => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, e);
  if (pts.size === 2) {
    const [a, b] = [...pts.values()];
    const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    camZ += (d - pinchD) * 2.2; pinchD = d; moved = 99;
    return;
  }
  if (!drag.down) return;
  const now = performance.now(), dt = Math.max(now - lt, 8) / 1000;
  const dx = e.clientX - lx, dy = e.clientY - ly;
  moved = Math.max(moved, Math.abs(e.clientX - sx) + Math.abs(e.clientY - sy));
  camZ -= dy * 1.7;                          // deslizar hacia arriba = avanzar
  flyVel = -dy * 1.7 / dt * .016;
  lx = e.clientX; ly = e.clientY; lt = now;
});
const release = e => {
  pts.delete(e.pointerId);
  if (pts.size < 2) pinchD = 0;
  if (!pts.size) { drag.down = false; stage.classList.remove("dragging"); }
};
stage.addEventListener("pointerup", e => {
  /* tap = abrir obra. Se resuelve por proyección matemática (cardAt), nunca
     por e.target/closest: setPointerCapture roba el click y el hit-testing 3D
     nativo es poco fiable. Mismo criterio que las tiras del sitio principal. */
  const tap = pts.size === 1 && moved <= 8 && performance.now() - downT < 600;
  const card = tap ? (cardAt(e.clientX, e.clientY) || downCard) : null;
  release(e);
  downCard = null;
  if (card && !phase && !cineOpen) openCine(+card.dataset.i);
});
stage.addEventListener("pointercancel", e => { release(e); downCard = null; });
stage.addEventListener("wheel", e => { e.preventDefault(); camZ -= e.deltaY * .9; targetZ = null; seen(); }, { passive: false });
stage.addEventListener("dragstart", e => e.preventDefault());
function step(d) {
  targetZ = (d > 0 ? Math.floor(camZ / G) + 1 : Math.ceil(camZ / G) - 1) * G;
  flyVel = 0; seen();
}
addEventListener("keydown", e => {
  if (cineOpen) {
    if (e.key === "Escape") closeCine();
    return;
  }
  if (e.key === "Escape" && window.parent && window.parent !== window && parent.galClose) { parent.galClose(); return; }
  if (e.key === "ArrowUp" || e.key === "ArrowRight") step(1);
  if (e.key === "ArrowDown" || e.key === "ArrowLeft") step(-1);
});

/* ---------- apertura de obra: solo por tap en pointerup (ver arriba) ---------- */
/* Hit-testing matemático: el hit-testing nativo de Chrome falla con
   preserve-3d + perspective (elementFromPoint devuelve el contenedor, no la
   card → la mayoría de las obras no clickean, sobre todo al moverse). Por eso
   calculamos qué obra está bajo el pointer proyectando cada card y eligiendo
   la más cercana. Funciona a cualquier profundidad y tras recorrer mucho. */
function cardAt(x, y) {
  let best = null, bestZ = -Infinity;
  for (const c of cards) {
    const z = c._z + camZ;
    if (z >= 880) continue;                 // encima/detrás de la cámara
    const r = c.getBoundingClientRect();
    if (r.width < 2 || r.height < 2) continue;
    if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom && z > bestZ) {
      bestZ = z; best = c;
    }
  }
  return best;
}

function fitRect(aspect) {
  /* margen cómodo en TODOS los lados (≥32px) para clickear afuera y volver */
  const vw = innerWidth, vh = innerHeight;
  const pad = Math.min(72, Math.max(32, Math.min(vw, vh) * .07));
  const aw = vw - pad * 2, ah = vh - pad * 2;
  let w = aw, h = aw / aspect;
  if (h > ah) { h = ah; w = ah * aspect; }
  return { top: (vh - h) / 2, left: (vw - w) / 2, width: w, height: h };
}
function setRect(el, r) {
  el.style.top = r.top + "px"; el.style.left = r.left + "px";
  el.style.width = r.width + "px"; el.style.height = r.height + "px";
}
function openCine(i) {
  idx = ((i % N) + N) % N;
  const it = pool[idx];
  cineCard = cards[idx];
  cineOpen = true; targetZ = null; flyVel = 0;
  cineAspect = it.kind === "reel" ? 9 / 16 : 16 / 9;
  dim.classList.add("on");
  cine.classList.add("open");
  /* clon visual de la obra → vuela desde su posición exacta hasta el centro */
  fly.className = "vcard fly " + it.kind + " poster" + (it.is3d ? " is3d" : "");
  fly.innerHTML = cineCard.innerHTML;
  fly.style.display = "block";
  fly.classList.remove("gone");
  fly.style.transition = "none";
  setRect(fly, cineCard.getBoundingClientRect());
  fly.style.borderRadius = "3px";
  void fly.offsetWidth;
  fly.style.transition = "";
  setRect(fly, fitRect(cineAspect));
  phase = "in";
  layerPush(closeCine);
  setTimeout(() => { if (phase === "in") land(); }, 850);
}
fly.addEventListener("transitionend", e => {
  if (e.propertyName !== "width" && e.propertyName !== "height") return;
  if (phase === "in") land();
  else if (phase === "out") finishClose();
});
function land() {
  phase = "open";
  fly.classList.add("gone");
  mount(pool[idx]);
}
/* sin controles: video nativo autoplay (loop) o embed de YouTube sin barra.
   Click en la preview = play/pausa invisible. Click afuera = volver. */
function mount(it) {
  const r = fitRect(it.kind === "reel" ? 9 / 16 : 16 / 9);
  const sz = `width:${r.width}px;height:${r.height}px`;
  if (it.kind === "reel") {
    const src = it.src.replace("/assets/reels/", "/assets/reels-lo/");
    cineMedia.innerHTML = `<video src="${src}" style="${sz}" autoplay loop playsinline></video>`;
    const v = cineMedia.querySelector("video");
    if (v && v.play) v.play().catch(() => { v.muted = true; v.play().catch(() => {}); });
  } else {
    cineMedia.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${it.yt}?autoplay=1&rel=0&controls=0&playsinline=1"
      sandbox="allow-scripts allow-same-origin allow-presentation allow-popups"
      style="${sz}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
      referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
  }
}
cineMedia.addEventListener("click", e => {
  if (phase !== "open") return;
  const v = cineMedia.querySelector("video");
  if (v && (e.target === v || v.contains(e.target))) { v.paused ? v.play() : v.pause(); }
});
cine.addEventListener("click", e => {
  if (phase === "open" && (e.target === cine || e.target === cineMedia)) closeCine();
});

function closeCine(fromPop) {
  if (phase !== "open") return;
  if (!fromPop) layerDrop();
  cineMedia.innerHTML = "";                  // corta reproducción ya
  phase = "out";
  fly.classList.remove("gone");
  fly.style.display = "block";
  fly.style.transition = "none";
  setRect(fly, fitRect(cineAspect));
  void fly.offsetWidth;
  fly.style.transition = "";
  setRect(fly, cineCard.getBoundingClientRect());
  dim.classList.remove("on");
  setTimeout(() => { if (phase === "out") finishClose(); }, 850);
}
function finishClose() {
  phase = null;
  fly.style.display = "none";
  fly.classList.remove("gone");
  cine.classList.remove("open");
  dim.classList.remove("on");
  cineOpen = false;                          // el paseo se reanuda solo
}
addEventListener("resize", () => {
  sizeStars();
  computeRecycle();                         // el encuadre cambió → nuevo umbral
  if (phase === "in" || phase === "out") setRect(fly, fitRect(cineAspect));
  if (phase === "open") {
    const m = cineMedia.firstElementChild;
    if (m) { const r = fitRect(cineAspect); m.style.width = r.width + "px"; m.style.height = r.height + "px"; }
  }
});

/* ---------- arranque ---------- */
/* embebida en el portfolio (iframe): la ✕ del overlay cierra; Esc también */
if (window.parent && window.parent !== window) document.body.classList.add("embedded");
build();

/* ---------- dormir / despertar: la galería se PRECARGA ----------
   Armada pero quieta: ni un frame hasta que se abra. Al cerrar no se descarga,
   así que volver a entrar es instantáneo. Same-origin, sin postMessage. */
function __wake() {
  if (raf) return;
  lastT = 0;
  raf = requestAnimationFrame(t => { lastT = t; tick(t); });
}
function __sleep() {
  if (raf) { cancelAnimationFrame(raf); raf = 0; }
  if (cineOpen) closeCine(true);
}
window.__bloqqWake = __wake;
window.__bloqqSleep = __sleep;

/* Si el overlay ya está abierto al arrancar, arranca despierta (carrera cubierta
   en los dos sentidos); si viene con ?preload=1 y está cerrado, duerme. */
const abiertoYa = (() => {
  try { return window.parent.document.getElementById("galBox").classList.contains("open"); }
  catch (e) { return false; }
})();
const precargando = /[?&]preload=1/.test(location.search) && !abiertoYa;
if (!precargando) __wake();
</script>
</body>
